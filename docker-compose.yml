# =============================================================================
# MindOS Docker Compose 部署配置
#
# 工作流：
#   1. 首次 / 源码变更时，构建 builder 缓存镜像：
#      docker compose build builder
#      （builder 服务挂载在 profiles: ["builder"] 下，不会随 up 启动；
#       显式指定服务名即可构建，无需再手动注释/取消注释）
#
#   2. 日常启动（秒级，BuildKit 自动复用 builder 缓存）：
#      docker compose up -d --build
#
# 服务端口：
#   - Web UI:  http://<服务器IP>:3456
#   - MCP:     http://<服务器IP>:8781/mcp
# =============================================================================

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # Builder 服务 —— 仅用于构建缓存镜像，不随日常启动运行
  # 需要构建时：docker compose build builder
  # ═══════════════════════════════════════════════════════════════════════════
  builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: mindos-builder:${MINDOS_VERSION:-latest}
    profiles: ["builder"]

  # ── MindOS 运行时服务 ──
  mindos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindos
    restart: unless-stopped

    ports:
      # Web UI（Next.js）
      - "${MINDOS_WEB_PORT:-3456}:3456"
      # MCP HTTP Server（Agent 协议接入）
      - "${MINDOS_MCP_PORT:-8781}:8781"

    environment:
      # ── 服务配置 ──
      - MINDOS_WEB_PORT=3456
      - MINDOS_MCP_PORT=8781
      - MINDOS_WEB_HOST=0.0.0.0
      - MCP_HOST=0.0.0.0
      - MCP_TRANSPORT=http
      - MINDOS_NEXT_STANDALONE=1
      - NODE_ENV=production
      - MIND_ROOT=/data/mind

      # ── AI 配置通过 config.json 管理，见 config.example.json ──

      # ── 可选：安全认证 ──
      - AUTH_TOKEN=${AUTH_TOKEN:-}

      # ── 日志配置 ──
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PRETTY_LOGS=${PRETTY_LOGS:-true}
      - MINDOS_DEBUG=${MINDOS_DEBUG:-0}

    volumes:
      # 知识库数据持久化
      - ./data:/data/mind
      # MindOS 配置持久化（Web /settings 写入的 AI 配置保存在
      # 容器内 /root/.mindos/config.json，用可写命名卷防止容器重建后丢失；
      # 不要用 :ro 挂载 config.json —— 与 Web 设置页的写入冲突）
      - mindos-config:/root/.mindos

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

    # 日志限制（防止占满磁盘）
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    # 健康检查
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3456/api/health').then(r=>r.json()).then(d=>{if(!d.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 命名卷声明（保留知识库数据与 MindOS 配置）
volumes:
  mindos-config:
